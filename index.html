
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Notes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h2>📝 My Notes</h2>
  <p>Your personal notebook</p>
</header>

<div class="container">
  <input id="search" placeholder="🔍 Search notes...">

  <div class="toolbar">
    <button onclick="showAll()">All Notes</button>
    <button onclick="showPinned()">📌 Pinned</button>
  </div>

  <div class="editor">
    <input id="title" placeholder="Note title...">
    <textarea id="content" placeholder="Write your thoughts..."></textarea>
    <button onclick="saveNote()">＋ Save Note</button>
  </div>

  <h3>My Collection</h3>
  <div id="notes"></div>
</div>

<script src="script.js"></script>
</body>
</html>
