
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1769e8">
  <title>My Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>📝 My Notes</h1>
    <p>Your personal notes app</p>
  </header>

  <main>
    <section class="editor">
      <h2 id="editorHeading">Create Note</h2>
      <input id="title" placeholder="Enter note title">
      <textarea id="content" placeholder="Write your notes here..."></textarea>
      <button id="saveBtn">Save Note</button>
      <button id="clearBtn" class="secondary">Clear</button>
    </section>

    <section>
      <h2>My Notes</h2>
      <input id="search" placeholder="Search notes...">
      <div id="notes"></div>
    </section>

    <section class="backup">
      <h2>Local Backup</h2>
      <button id="backupBtn">Download Backup</button>
      <button id="restoreBtn" class="secondary">Restore Backup</button>
      <input id="fileInput" type="file" accept=".json" hidden>
    </section>
  </main>

  <script src="script.js"></script>
</body>
  </html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-connect Notes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- डार्क मोड बटन -->
    <button id="theme-toggle">🌙 Dark Mode</button>

    <div class="container">
        <div class="card">
            <h2>Create Note</h2>
            <input type="text" id="note-title" placeholder="Enter note title">
            <textarea id="note-text" placeholder="Write your notes here..." rows="6"></textarea>
            <div class="btn-group">
                <button id="save-btn" class="btn btn-primary">Save Note</button>
                <button id="clear-btn" class="btn btn-secondary">Clear</button>
            </div>
        </div>

        <h2>My Notes</h2>
        <input type="text" id="search-notes" placeholder="Search notes...">
        <div id="notes-container">
            <p id="no-notes">No notes found.</p>
        </div>

        <div class="card backup-section">
            <h2>Local Backup</h2>
            <div class="btn-group">
                <button id="download-btn" class="btn btn-primary">Download Backup</button>
                <button id="restore-btn" class="btn btn-secondary">Restore Backup</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
    </html>
